import org.gradle.util.GradleVersion

// Android Gradle Plugin 8.13.0 (pinned below) requires Gradle 8.13 or newer as a hard minimum.
// Running it under an older Gradle fails with a cryptic, hard-to-search error -
// "Could not generate a decorated class for type LibraryPlugin ... BuildFeatures" - because AGP
// references a Gradle API class that simply doesn't exist yet in older releases. This check turns
// that into an immediate, actionable message instead.
if (GradleVersion.current() < GradleVersion.version("8.13")) {
    throw new GradleException(
        "capacitor-location-aware-photo-picker requires Gradle 8.13 or newer (found ${GradleVersion.current().version}). " +
        "Run 'gradle wrapper --gradle-version 8.13.2' from this directory and use ./gradlew from then on, " +
        "or upgrade your system-installed Gradle. See this repo's README 'Testing' section for details."
    )
}

ext {
    capacitorVersion = '8.5.0' //System.getenv('CAPACITOR_VERSION')
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    androidxExifInterfaceVersion = project.hasProperty('androidxExifInterfaceVersion') ? rootProject.ext.androidxExifInterfaceVersion : '1.4.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    robolectricVersion = project.hasProperty('robolectricVersion') ? rootProject.ext.robolectricVersion : '4.16'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        if (System.getenv("CAP_PLUGIN_PUBLISH") == "true") {
            classpath 'io.github.gradle-nexus:publish-plugin:1.3.0'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
if (System.getenv("CAP_PLUGIN_PUBLISH") == "true") {
    apply plugin: 'io.github.gradle-nexus.publish-plugin'
    apply from: file('../scripts/android/publish-root.gradle')
    apply from: file('../scripts/android/publish-module.gradle')
}

android {
    namespace = "com.locationawarephotopicker.plugin"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        // ACTION_GET_CONTENT (via GetMultipleContents) works across this plugin's whole supported
        // range. GPS recovery's setRequireOriginal fallback needs API 29 (MediaStore.setRequireOriginal
        // itself); the initial-copy recovery path (per warting/exif_picker_lab's findings - see
        // README) has no such floor. minSdkVersion is left at this project's baseline rather than
        // raised for GPS recovery specifically, since picking itself is unaffected either way.
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    testOptions {
        unitTests {
            // Robolectric needs this to load the plugin's own AndroidManifest.xml/resources.
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    publishing {
        singleVariant("release")
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    //if (System.getenv("CAP_PLUGIN_PUBLISH") == "true") {
        implementation "com.capacitorjs:core:$capacitorVersion"
    //} else {
    //    implementation project(':capacitor-android')
    //}

    implementation "androidx.exifinterface:exifinterface:$androidxExifInterfaceVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.core:core-ktx:1.17.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
